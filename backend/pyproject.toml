[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scamguard-api"
version = "0.1.0"
description = "Auditable, advisory scam investigation API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "langgraph==1.2.4",
  "opencv-python-headless==5.0.0.93",
  "psycopg[binary]==3.2.10",
  "pydantic==2.14.3",
  "pytesseract==0.3.13",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.33",
  "pyjwt==2.10.1",
  "scikit-learn==1.9.1",
  "sqlalchemy==2.0.57",
  "uvicorn[standard]==0.36.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.2.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
